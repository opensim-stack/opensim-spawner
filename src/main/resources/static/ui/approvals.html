<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSim Spawner UI - Approvals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              900: '#0a0a12',
              800: '#12121f',
              700: '#1a1a2e'
            },
            neon: {
              primary: '#8b5cf6',
              secondary: '#d946ef',
              accent: '#06b6d4'
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body class="min-h-screen bg-dark-900 text-gray-100 dark">
  <canvas id="code-rain"></canvas>
  <div class="cyber-grid"></div>
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>

  <div class="relative z-10 min-h-screen flex">
    <spawner-side-menu data-active="approvals"></spawner-side-menu>

    <main class="flex-1 p-6 lg:p-10">
      <div class="max-w-6xl mx-auto">
        <div class="mb-8 flex items-center justify-between gap-4">
          <div>
            <h1 class="text-3xl lg:text-4xl font-bold text-white">Approvals</h1>
            <p class="text-gray-400">Review pending user registration approvals.</p>
          </div>
          <button id="refresh-approvals" class="px-4 py-2 rounded-lg border border-neon-primary/50 text-gray-100 hover:bg-neon-primary/10 transition-colors">
            Refresh
          </button>
        </div>

        <section class="feature-card bg-dark-800/80 backdrop-blur rounded-xl border border-neon-primary/20 overflow-visible">
          <div class="grid grid-cols-[minmax(0,1fr)_minmax(0,1fr)_minmax(10rem,auto)_auto] gap-4 px-5 py-3 border-b border-neon-primary/20 text-xs uppercase tracking-wide text-neon-accent">
            <div>User</div>
            <div>Email</div>
            <div>Requested</div>
            <div>Actions</div>
          </div>

          <div id="approvals-list" class="divide-y divide-neon-primary/10"></div>
          <div id="approvals-empty" class="hidden p-6 text-gray-300">No pending approvals found.</div>
        </section>
      </div>

      <div id="toast-container" class="fixed right-6 top-6 z-50 flex w-[min(24rem,calc(100vw-2rem))] flex-col gap-3 pointer-events-none"></div>
    </main>
  </div>

  <script type="module" src="/ui/menu-component.js"></script>
  <script src="/ui/ui-common.js"></script>
  <script type="module" src="/ui/approvals.js"></script>
</body>
</html>
