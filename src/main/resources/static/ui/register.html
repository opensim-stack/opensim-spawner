<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSim Spawner UI - Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              900: '#0a0a12',
              800: '#12121f',
              700: '#1a1a2e'
            },
            neon: {
              primary: '#8b5cf6',
              secondary: '#d946ef',
              accent: '#06b6d4'
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body class="min-h-screen bg-dark-900 text-gray-100 dark">
  <canvas id="code-rain"></canvas>
  <div class="cyber-grid"></div>
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>

  <main class="relative z-10 min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-xl bg-dark-800/90 border border-neon-primary/30 rounded-2xl p-8">
      <div class="flex items-center gap-3 mb-8">
        <img src="/ui/opensim-stack.png" alt="OpenSim AI Stack" class="h-10 w-auto">
        <div>
          <h1 class="text-xl font-bold gradient-text">Register User Account</h1>
          <p class="text-sm text-gray-400">Submit an approval request for review</p>
        </div>
      </div>

      <form id="register-form" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <label class="block">
            <span class="text-sm text-gray-300">First name</span>
            <input id="register-first" required type="text" autocomplete="given-name"
              class="mt-1 w-full rounded-lg bg-dark-700 border border-neon-primary/30 px-3 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-neon-primary">
          </label>
          <label class="block">
            <span class="text-sm text-gray-300">Last name</span>
            <input id="register-last" required type="text" autocomplete="family-name"
              class="mt-1 w-full rounded-lg bg-dark-700 border border-neon-primary/30 px-3 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-neon-primary">
          </label>
        </div>

        <label class="block">
          <span class="text-sm text-gray-300">Email</span>
          <input id="register-email" required type="email" autocomplete="email"
            class="mt-1 w-full rounded-lg bg-dark-700 border border-neon-primary/30 px-3 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-neon-primary">
        </label>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <label class="block">
            <span class="text-sm text-gray-300">Password</span>
            <input id="register-password" required type="password" autocomplete="new-password"
              class="mt-1 w-full rounded-lg bg-dark-700 border border-neon-primary/30 px-3 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-neon-primary">
          </label>
          <label class="block">
            <span class="text-sm text-gray-300">Confirm password</span>
            <input id="register-password-confirm" required type="password" autocomplete="new-password"
              class="mt-1 w-full rounded-lg bg-dark-700 border border-neon-primary/30 px-3 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-neon-primary">
          </label>
        </div>

        <p class="text-xs text-gray-400">First and last name must be alphanumeric (A-Z, a-z, 0-9) only.</p>
        <p id="register-error" class="hidden text-sm text-rose-300"></p>
        <p id="register-success" class="hidden text-sm text-emerald-300"></p>

        <button id="register-btn" type="submit"
          class="w-full px-4 py-2 rounded-lg bg-neon-primary text-white font-semibold hover:bg-violet-500 transition-colors btn-glow">
          Submit Approval
        </button>
      </form>

      <div class="mt-6 text-sm text-gray-300">
        Already have access?
        <a href="/ui/login.html" class="text-neon-accent hover:text-neon-secondary">Sign in</a>
      </div>
    </div>
  </main>

  <script src="/ui/ui-common.js"></script>
  <script src="/ui/register.js"></script>
</body>
</html>
