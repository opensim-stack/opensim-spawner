<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSim Spawner UI - Change Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              900: '#0a0a12',
              800: '#12121f',
              700: '#1a1a2e'
            },
            neon: {
              primary: '#8b5cf6',
              secondary: '#d946ef',
              accent: '#06b6d4'
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body class="min-h-screen bg-dark-900 text-gray-100 dark">
  <canvas id="code-rain"></canvas>
  <div class="cyber-grid"></div>
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>

  <div class="relative z-10 min-h-screen flex">
    <spawner-side-menu data-active="change-password"></spawner-side-menu>

    <main class="flex-1 p-6 lg:p-10">
      <div class="max-w-3xl mx-auto space-y-8">
        <div>
          <h1 class="text-3xl lg:text-4xl font-bold text-white">Change Password</h1>
          <p class="text-gray-400">Update your own OpenSim account password.</p>
          <div id="change-password-grid-service-pill" class="mt-2 inline-flex items-center gap-2 rounded-full border px-3 py-1 text-xs border-amber-400/40 bg-amber-500/10 text-amber-200">
            <span class="w-2 h-2 rounded-full bg-amber-300"></span>
            <span>Grid Service: Unavailable</span>
          </div>
          <p id="change-password-grid-service-warning" class="hidden mt-2 text-sm text-amber-300">Password changes are disabled until a ROBUST or STANDALONE simulator is active.</p>
        </div>

        <section class="feature-card bg-dark-800/80 backdrop-blur rounded-xl p-6 border border-neon-primary/20">
          <h2 class="text-xl font-semibold text-white mb-4">Password Form</h2>
          <form id="change-password-form" class="space-y-4">
            <label class="block">
              <span class="text-sm text-gray-300">Old Password</span>
              <input id="old-password" required type="password" autocomplete="current-password"
                class="mt-1 w-full rounded-lg bg-dark-700 border border-neon-primary/30 px-3 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-neon-primary">
            </label>

            <label class="block">
              <span class="text-sm text-gray-300">New Password</span>
              <input id="new-password" required type="password" autocomplete="new-password"
                class="mt-1 w-full rounded-lg bg-dark-700 border border-neon-primary/30 px-3 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-neon-primary">
            </label>

            <label class="block">
              <span class="text-sm text-gray-300">Confirm Password</span>
              <input id="confirm-password" required type="password" autocomplete="new-password"
                class="mt-1 w-full rounded-lg bg-dark-700 border border-neon-primary/30 px-3 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-neon-primary">
            </label>

            <p id="change-password-error" class="hidden text-sm text-rose-300"></p>

            <div class="flex justify-end">
              <button id="change-password-submit" type="submit"
                class="px-4 py-2 rounded-lg bg-neon-primary text-white font-semibold hover:bg-violet-500 transition-colors btn-glow">Save</button>
            </div>
          </form>
        </section>
      </div>

      <div id="toast-container" class="fixed right-6 top-6 z-50 flex w-[min(24rem,calc(100vw-2rem))] flex-col gap-3 pointer-events-none"></div>
    </main>
  </div>

  <script type="module" src="/ui/menu-component.js"></script>
  <script src="/ui/ui-common.js"></script>
  <script type="module" src="/ui/change-password.js"></script>
</body>
</html>
