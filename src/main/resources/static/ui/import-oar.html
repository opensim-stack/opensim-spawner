<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSim Spawner UI - Import OAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              900: '#0a0a12',
              800: '#12121f',
              700: '#1a1a2e'
            },
            neon: {
              primary: '#8b5cf6',
              secondary: '#d946ef',
              accent: '#06b6d4'
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body class="min-h-screen bg-dark-900 text-gray-100 dark">
  <canvas id="code-rain"></canvas>
  <div class="cyber-grid"></div>
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>

  <div class="relative z-10 min-h-screen flex">
    <spawner-side-menu data-active="simulators"></spawner-side-menu>

    <main class="flex-1 p-6 lg:p-10">
      <div class="max-w-3xl mx-auto">
        <div class="mb-6 flex items-center justify-between gap-4">
          <div>
            <h1 class="text-3xl lg:text-4xl font-bold text-white">Import OAR</h1>
            <p id="import-subtitle" class="text-gray-400"></p>
          </div>
          <a id="import-back-link" href="/ui/simulators.html" class="px-4 py-2 rounded-lg border border-neon-primary/50 text-gray-100 hover:bg-neon-primary/10 transition-colors">Back</a>
        </div>

        <section class="feature-card bg-dark-800/80 backdrop-blur rounded-xl p-6 border border-neon-primary/20">
          <form id="import-form" class="space-y-5">
            <div>
              <label for="import-file" class="flex items-center gap-2 text-sm font-semibold text-gray-200 mb-2">
                <svg class="h-4 w-4 text-neon-accent" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 3v10.5"></path><path d="m6.5 13 3.5 3.5L13.5 13"></path><path d="M3.5 15.5V14"></path></svg>
                OAR File
              </label>
              <input id="import-file" name="file" type="file" accept=".oar,.OAR,application/octet-stream"
                class="w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-neon-primary/10 file:text-neon-primary file:font-semibold file:hover:bg-neon-primary/20 file:transition-colors" />
              <p id="import-file-hint" class="mt-1.5 text-xs text-gray-500">Upload OAR file to import.</p>
            </div>

            <div>
              <label for="import-url" class="flex items-center gap-2 text-sm font-semibold text-gray-200 mb-2">
                <svg class="h-4 w-4 text-neon-accent" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 12.5 12 8.5"></path><path d="M6.5 6.5a3 3 0 0 1 4.24 0l.76.76"></path><path d="m8.5 13.5.76.76a3 3 0 0 0 4.24-4.24l-.76-.76"></path></svg>
                OAR URL
              </label>
              <input id="import-url" name="url" type="url" autocomplete="off"
                class="w-full px-3 py-2 rounded-lg bg-dark-900/70 border border-neon-primary/30 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-neon-primary focus:ring-1 focus:ring-neon-primary transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                placeholder="https://example.com/my-region.oar" />
              <p id="import-url-hint" class="mt-1.5 text-xs text-gray-500">Or, direct URL import.</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <label class="inline-flex items-center gap-2 text-sm text-gray-300">
                <input id="import-merge" type="checkbox" checked class="h-4 w-4 rounded border-neon-primary/40 bg-dark-700 text-neon-primary focus:ring-neon-primary">
                <span>Merge</span>
              </label>
              <label class="inline-flex items-center gap-2 text-sm text-gray-300">
                <input id="import-skip-assets" type="checkbox" class="h-4 w-4 rounded border-neon-primary/40 bg-dark-700 text-neon-primary focus:ring-neon-primary">
                <span>Skip Assets</span>
              </label>
            </div>

            <div id="import-drop-target" class="rounded-lg border border-dashed border-neon-primary/30 bg-dark-900/40 px-4 py-3 text-sm text-gray-400 transition-colors">
              Drop file or link here
            </div>

            <p id="import-error" class="hidden text-sm text-rose-300"></p>

            <div class="flex justify-end">
              <button id="import-submit" type="submit"
                class="px-4 py-2 rounded-lg bg-neon-primary text-white font-semibold hover:bg-violet-500 transition-colors btn-glow">Import</button>
            </div>
          </form>
        </section>
      </div>

      <div id="toast-container" class="fixed right-6 top-6 z-50 flex w-[min(24rem,calc(100vw-2rem))] flex-col gap-3 pointer-events-none"></div>
    </main>
  </div>

  <script type="module" src="/ui/menu-component.js"></script>
  <script src="/ui/ui-common.js"></script>
  <script type="module" src="/ui/import-oar.js"></script>
</body>
</html>
