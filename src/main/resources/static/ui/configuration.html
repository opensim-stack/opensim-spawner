<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSim Spawner UI - Configuration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              900: '#0a0a12',
              800: '#12121f',
              700: '#1a1a2e'
            },
            neon: {
              primary: '#8b5cf6',
              secondary: '#d946ef',
              accent: '#06b6d4'
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body class="min-h-screen bg-dark-900 text-gray-100 dark">
  <canvas id="code-rain"></canvas>
  <div class="cyber-grid"></div>
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>

  <div class="relative z-10 min-h-screen flex">
    <spawner-side-menu data-active="configuration"></spawner-side-menu>

    <main class="flex-1 p-6 lg:p-10">
      <div class="max-w-5xl mx-auto space-y-8">
        <div>
          <h1 class="text-3xl lg:text-4xl font-bold text-white">Configuration</h1>
          <p class="text-gray-400">Configure global settings for stack operations.</p>
        </div>

        <section class="feature-card bg-dark-800/80 backdrop-blur rounded-xl p-6 border border-neon-primary/20">
          <h2 class="text-xl font-semibold text-white">Updates</h2>
          <p class="mt-1 text-sm text-gray-400">Configure Docker Hub credentials and update policy.</p>

          <form id="updates-form" class="mt-5 space-y-4">
            <label class="inline-flex items-center gap-2 text-sm text-gray-200">
              <input id="automatic-updates" type="checkbox" class="h-4 w-4 rounded border-neon-primary/40 bg-dark-700 text-neon-primary focus:ring-neon-primary">
              <span>Automatic updates</span>
            </label>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <label class="block">
                <span class="text-sm text-gray-300">Tag</span>
                <input id="updates-tag" type="text" placeholder="latest"
                  class="mt-1 w-full rounded-lg bg-dark-700 border border-neon-primary/30 px-3 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-neon-primary">
              </label>

              <label class="block">
                <span class="text-sm text-gray-300">Docker Hub Username</span>
                <input id="dockerhub-username" type="text"
                  class="mt-1 w-full rounded-lg bg-dark-700 border border-neon-primary/30 px-3 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-neon-primary">
              </label>
            </div>

            <label class="block">
              <span class="text-sm text-gray-300">Docker Hub Token</span>
              <input id="dockerhub-token" type="password" autocomplete="off"
                class="mt-1 w-full rounded-lg bg-dark-700 border border-neon-primary/30 px-3 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-neon-primary">
            </label>

            <div class="flex justify-end">
              <button id="save-updates" type="submit"
                class="px-4 py-2 rounded-lg border border-neon-primary/40 text-gray-100 hover:bg-neon-primary/10 transition-colors">
                Save
              </button>
            </div>
          </form>
        </section>
      </div>

      <div id="toast-container" class="fixed right-6 top-6 z-50 flex w-[min(24rem,calc(100vw-2rem))] flex-col gap-3 pointer-events-none"></div>
    </main>
  </div>

  <script type="module" src="/ui/menu-component.js"></script>
  <script src="/ui/ui-common.js"></script>
  <script type="module" src="/ui/configuration.js"></script>
</body>
</html>
