<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSim Spawner UI - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              900: '#0a0a12',
              800: '#12121f',
              700: '#1a1a2e'
            },
            neon: {
              primary: '#8b5cf6',
              secondary: '#d946ef',
              accent: '#06b6d4'
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body class="min-h-screen bg-dark-900 text-gray-100 dark">
  <canvas id="code-rain"></canvas>
  <div class="cyber-grid"></div>
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>

  <main class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-dark-800/85 backdrop-blur border border-neon-primary/30 rounded-2xl p-8 neon-border">
      <div class="flex items-center gap-3 mb-8">
        <img src="/ui/opensim-stack.png" alt="OpenSim AI Stack" class="h-10 w-auto">
        <div>
          <h1 class="text-xl font-bold gradient-text">OpenSim Spawner</h1>
          <p class="text-sm text-gray-400">Sign in to manage bots</p>
        </div>
      </div>

      <form id="login-form" class="space-y-4">
        <label class="block">
          <span class="text-sm text-gray-300">Username</span>
          <input name="username" autocomplete="username" required
            class="mt-1 w-full rounded-lg bg-dark-700 border border-neon-primary/30 px-3 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-neon-primary"
            type="text">
        </label>

        <label class="block">
          <span class="text-sm text-gray-300">Password</span>
          <input name="password" autocomplete="current-password" required
            class="mt-1 w-full rounded-lg bg-dark-700 border border-neon-primary/30 px-3 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-neon-primary"
            type="password">
        </label>

        <button id="login-btn" type="submit"
          class="w-full px-4 py-2 rounded-lg bg-neon-primary text-white font-semibold hover:bg-violet-500 transition-colors btn-glow">
          Sign In
        </button>
      </form>

      <p id="login-error" class="hidden mt-4 text-sm text-rose-300"></p>
    </div>
  </main>

  <script src="/ui/ui-common.js"></script>
  <script src="/ui/login.js"></script>
</body>
</html>
