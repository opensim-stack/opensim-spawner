<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSim Spawner UI - Import Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              900: '#0a0a12',
              800: '#12121f',
              700: '#1a1a2e'
            },
            neon: {
              primary: '#8b5cf6',
              secondary: '#d946ef',
              accent: '#06b6d4'
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body class="min-h-screen bg-dark-900 text-gray-100 dark">
  <canvas id="code-rain"></canvas>
  <div class="cyber-grid"></div>
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>

  <div class="relative z-10 min-h-screen flex">
    <spawner-side-menu data-active="bots"></spawner-side-menu>

    <main class="flex-1 p-6 lg:p-10">
      <div class="max-w-3xl mx-auto">
        <div class="mb-6 flex items-center justify-between gap-4">
          <div>
            <h1 class="text-3xl lg:text-4xl font-bold text-white">Import Inventory</h1>
            <p id="import-subtitle" class="text-gray-400"></p>
          </div>
          <a id="import-back-link" href="/ui/bots.html" class="px-4 py-2 rounded-lg border border-neon-primary/50 text-gray-100 hover:bg-neon-primary/10 transition-colors">Back</a>
        </div>

        <section class="feature-card bg-dark-800/80 backdrop-blur rounded-xl p-6 border border-neon-primary/20">
          <form id="import-form" class="space-y-5">
            <div>
              <label for="import-path" class="flex items-center gap-2 text-sm font-semibold text-gray-200 mb-2">
                <svg class="h-4 w-4 text-neon-accent" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h3.65a1.5 1.5 0 0 1 1.34.82l.7 1.36a1.5 1.5 0 0 0 1.34.82H15.5A1.5 1.5 0 0 1 17 8.5v6A1.5 1.5 0 0 1 15.5 16h-11A1.5 1.5 0 0 1 3 14.5z"></path></svg>
                Inventory Path
              </label>
              <input id="import-path" name="path" type="text" autocomplete="off"
                class="w-full px-3 py-2 rounded-lg bg-dark-900/70 border border-neon-primary/30 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-neon-primary focus:ring-1 focus:ring-neon-primary transition-colors"
                placeholder="Inventory/Imports/<filename>" />
              <p id="import-path-hint" class="mt-1.5 text-xs text-gray-500">Path inside the bot's inventory. Leave blank to import to the root.</p>
            </div>

            <div>
              <label for="import-file" class="flex items-center gap-2 text-sm font-semibold text-gray-200 mb-2">
                <svg class="h-4 w-4 text-neon-accent" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 3v10.5"></path><path d="m6.5 13 3.5 3.5L13.5 13"></path><path d="M3.5 15.5V14"></path></svg>
                IAR File
              </label>
              <input id="import-file" name="file" type="file" accept=".iar,.IAR,application/octet-stream" required
                class="w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-neon-primary/10 file:text-neon-primary file:font-semibold file:hover:bg-neon-primary/20 file:transition-colors" />
              <p id="import-file-hint" class="mt-1.5 text-xs text-gray-500">Select the IAR file to import.</p>
            </div>

            <p id="import-error" class="hidden text-sm text-rose-300"></p>
            <p id="import-success" class="hidden text-sm text-emerald-300"></p>

            <div class="flex justify-end">
              <button id="import-submit" type="submit"
                class="px-4 py-2 rounded-lg bg-neon-primary text-white font-semibold hover:bg-violet-500 transition-colors btn-glow">Import</button>
            </div>
          </form>
        </section>
      </div>

      <div id="toast-container" class="fixed right-6 top-6 z-50 flex w-[min(24rem,calc(100vw-2rem))] flex-col gap-3 pointer-events-none"></div>
    </main>
  </div>

  <script type="module" src="/ui/menu-component.js"></script>
  <script src="/ui/ui-common.js"></script>
  <script type="module" src="/ui/import-iar.js"></script>
</body>
</html>
