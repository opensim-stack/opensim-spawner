[WebRtcVoice]
    Enabled = %env.OPENSIM_WEBRTC_VOICE_ENABLED%
    SpatialVoiceService = WebRtcJanusService.dll:WebRtcJanusService
    NonSpatialVoiceService = WebRtcJanusService.dll:WebRtcJanusService
    WebRtcVoiceServerURI = ${Const|PrivURL}:${Const|PrivatePort}
    MessageDetails = true

[JanusWebRtcVoice]
    JanusGatewayURI = http://%env.OPENSIM_JANUS_PUBLIC_HOST%:%env.JANUS_HTTP_PORT%%env.JANUS_HTTP_BASEPATH%
    APIToken = %env.JANUS_API_TOKEN%
    JanusGatewayAdminURI = http://%env.OPENSIM_JANUS_PUBLIC_HOST%:%env.JANUS_HTTP_ADMIN_PORT%%env.JANUS_HTTP_ADMIN_BASEPATH%
    AdminAPIToken = %env.JANUS_ADMIN_TOKEN%
    MessageDetails = true
