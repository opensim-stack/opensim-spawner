
server.address=${OPENSIM_SPAWNER_HTTP_HOST:0.0.0.0}
server.port=${OPENSIM_SPAWNER_HTTP_PORT:8993}

spawner.data-dir=${OPENSIM_SPAWNER_DATA_DIR:/data}
spawner.config-dir=${OPENSIM_SPAWNER_CONFIG_DIR:/config}
spawner.workspace-dir=${OPENSIM_SPAWNER_WORKSPACE_DIR:/workspace}
spawner.add-ons-dir=${OPENSIM_SPAWNER_ADD_ONS_DIRECTORY:/config/add-ons}
spawner.add-ons-repository=${OPENSIM_SPAWNER_ADD_ONS_REPOSITORY:https://github.com/opensim-stack/opensim-add-ons.git}
spawner.add-ons-refresh-at-startup=${OPENSIM_SPAWNER_ADD_ONS_REFRESH_AT_STARTUP:true}

spawner.token=${OPENSIM_SPAWNER_TOKEN:}
spawner.first-port=${OPENSIM_SPAWNER_FIRST_PORT:9000}
spawner.last-port=${OPENSIM_SPAWNER_LAST_PORT:9015}
spawner.metaverse2mcp-image=${OPENSIM_METAVERSE2MCP_IMAGE:bithatch/opensim-metaverse2mcp:latest}
spawner.opencode-image=${OPENSIM_OPENCODE_IMAGE:bithatch/opensim-opencode:latest}
spawner.opensim-console-user=${OPENSIM_CONSOLE_USER:}
spawner.opensim-console-pass=${OPENSIM_CONSOLE_PASS:}

spawner.opensim-create-bot-user=${OPENSIM_CREATE_BOT_USER:true}
spawner.opensim-bot-first=${OPENSIM_BOT_FIRST:Bot}
spawner.opensim-bot-last=${OPENSIM_BOT_LAST:User}
spawner.opensim-bot-email=${OPENSIM_BOT_EMAIL:bot@localhost}
spawner.opensim-bot-appearance=${OPENSIM_BOT_APPEARANCE:Cube Bot}
spawner.opensim-bot-gender=${OPENSIM_BOT_GENDER:neutral}
spawner.opensim-handler-config=${OPENSIM_HANDLER_CONFIG:/config/handlers.json}
spawner.opensim-max-bots=${OPENSIM_SPAWNER_MAX_BOTS:10}
spawner.opensim-max-simulators=${OPENSIM_SPAWNER_MAX_SIMULATORS:10}
spawner.opensim-pull-policy=${OPENSIM_PULL_POLICY:missing}
spawner.opensim-restart-policy=${OPENSIM_RESTART_POLICY:unless-stopped}
spawner.opensim-network=${OPENSIM_NETWORK:${COMPOSE_PROJECT_NAME:opensim-ai}-network}
spawner.compose-project-name=${COMPOSE_PROJECT_NAME:opensim-ai}
spawner.opensim-estate-name=${OPENSIM_ESTATE_NAME:Botland}
spawner.opensim-estate-archive=${OPENSIM_ESTATE_ARCHIVE:blank}
spawner.opensim-region-x=${OPENSIM_REGION_X:1000}
spawner.opensim-region-y=${OPENSIM_REGION_Y:1000}
spawner.opensim-grid-name=${OPENSIM_GRID_NAME:Bot Grid}
spawner.opensim-grid-nick=${OPENSIM_GRID_NICK:botgrid}
spawner.opensim-grid-services=${OPENSIM_GRID_SERVICES:${COMPOSE_PROJECT_NAME:opensim-ai}-grid-services}

spawner.opensim-welcome-message=${OPENSIM_WELCOME_MESSAGE:Welcome to ${OPENSIM_GRID_NAME:Bot Grid}!}

spawner.opensim-robust-public-port=${OPENSIM_ROBUST_PUBLIC_PORT:8002}
spawner.opensim-robust-private-port=${OPENSIM_ROBUST_PRIVATE_PORT:8003}

spawner.opensim-user-email=${OPENSIM_USER_EMAIL:admin@example.com}
spawner.opensim-user-password=${OPENSIM_USER_PASSWORD:changeme}
spawner.opensim-user-first=${OPENSIM_USER_FIRST:Bot}
spawner.opensim-user-last=${OPENSIM_USER_LAST:Handler}
spawner.opensim-provision-mode=${OPENSIM_PROVISION_MODE:guided}
spawner.opensim-hostname=${OPENSIM_HOSTNAME:opensim}

